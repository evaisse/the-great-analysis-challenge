name: Unified Toolchain Image

on:
  push:
    paths:
      - 'Dockerfile.unified'
      - 'docker-images/unified/**'
      - 'tooling/shared.ts'
      - 'tooling/chess.ts'
      - 'tooling/cli.ts'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile.unified'
      - 'docker-images/unified/**'
      - 'tooling/shared.ts'
      - 'tooling/chess.ts'
      - 'tooling/cli.ts'
  workflow_dispatch:

env:
  BUN_VERSION: "1.3.9"

jobs:
  build:
    name: Build unified image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build unified image
        run: docker build -f Dockerfile.unified -t tgac-unified .

      - name: List included/excluded languages
        run: docker run --rm tgac-unified languages

      - name: Save image for smoke-test jobs
        run: docker save tgac-unified | gzip > tgac-unified.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tgac-unified-image
          path: tgac-unified.tar.gz
          retention-days: 1

  smoke-test:
    name: Smoke test ${{ matrix.language }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One representative language per included toolchain family
        # (docs/reference/unified-toolchain-image.md). The 9 excluded
        # languages (crystal, dart, elixir, gleam, julia, kotlin, nim,
        # rust, swift) are covered by the existing per-language toolchain
        # workflow instead (.github/workflows/test.yaml,
        # publish-toolchains.yml). elixir, gleam and rust were dropped from
        # this matrix after real build/run failures (this workflow's own
        # earlier runs, for elixir and rust; a local `docker build`, for
        # gleam) proved none has a working package-manager-only install
        # path on Debian bookworm (see docs/reference/
        # unified-toolchain-image.md "Local verification").
        language:
          - c
          - go
          - python
          - ruby
          - php
          - lua
          - haskell
          - javascript
          - typescript
          - elm
          - imba
          - rescript
          - zig
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tgac-unified-image

      - name: Load image
        run: docker load < tgac-unified.tar.gz

      - name: Build ${{ matrix.language }}
        run: docker run --rm -v ${{ github.workspace }}:/workspace tgac-unified build ${{ matrix.language }}

      - name: Analyze ${{ matrix.language }}
        run: docker run --rm -v ${{ github.workspace }}:/workspace tgac-unified analyze ${{ matrix.language }}

      - name: Internal tests for ${{ matrix.language }}
        run: docker run --rm -v ${{ github.workspace }}:/workspace tgac-unified test ${{ matrix.language }}

      - name: Chess engine suite (v1) for ${{ matrix.language }}
        run: docker run --rm -v ${{ github.workspace }}:/workspace tgac-unified test-chess-engine ${{ matrix.language }} --track v1

      # Unlike the per-language Docker workflow (test.yaml), the unified
      # image builds directly against this bind-mounted checkout, so a
      # working-tree diff after a run is expected for some languages
      # (committed build output regenerating, a first-run dependency
      # install writing node_modules/vendor files) rather than a sign of a
      # bug. See docs/reference/unified-toolchain-image.md "Bind-mount side
      # effects". Report what changed for visibility without failing the
      # job on it; each matrix job runs on its own disposable checkout.
      - name: Report workspace changes for ${{ matrix.language }}
        if: always()
        run: |
          echo "Working tree changes left by ${{ matrix.language }} (informational only):"
          git status --short implementations/${{ matrix.language }} || true
